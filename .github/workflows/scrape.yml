name: 抓健身房人數

on:
  schedule:
    # 每 30 分鐘（UTC）。GitHub 排程尖峰時可能延遲幾分鐘，屬正常現象
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    # 預設用 GitHub 的機器；若官網擋 GitHub，到 Settings → Secrets and variables →
    # Actions → Variables 新增 RUNNER = self-hosted，就會改用你自己電腦上的 runner
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.12"

      - name: 抓取人數
        run: python scrape.py

      - name: 提交資料
        run: python commit.py
